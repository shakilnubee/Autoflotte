<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Relevé kilométrique — Parc Pilot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1E3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0F1E3D; --muted:#64748B; --accent:#F97316; --line:#E7EBF0; }
  * { box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
  body { margin:0; background:#F1F5F9; color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:flex-start; }
  .wrap { max-width:480px; margin:0 auto; padding:1.1rem; width:100%; }
  .card { background:#fff; border:1px solid var(--line); border-radius:1.1rem; box-shadow:0 20px 50px -30px rgba(15,30,61,.4); overflow:hidden; margin-top:2.2rem; }
  .head { background:linear-gradient(135deg,#0B1220,#1E293B); color:#fff; padding:1.4rem 1.4rem 1.6rem; position:relative; }
  .head::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--accent),#FB923C 45%,transparent); }
  .eyebrow { font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:#8598B4; }
  .logo { font-weight:900; font-style:italic; font-size:1.05rem; letter-spacing:-.02em; }
  .logo .o { color:var(--accent); }
  .lang { position:absolute; top:1rem; right:1rem; display:inline-flex; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:9999px; overflow:hidden; }
  .lang button { border:none; background:transparent; color:#8598B4; font-weight:800; font-size:.72rem; padding:.28rem .6rem; cursor:pointer; letter-spacing:.03em; }
  .lang button.on { background:var(--accent); color:#fff; }
  .title { font-size:1.4rem; font-weight:900; font-style:italic; letter-spacing:-.02em; margin:.7rem 0 .1rem; color:#fff; }
  .sub { color:#8598B4; font-size:.92rem; }
  .plate { display:inline-flex; align-items:stretch; font-weight:800; letter-spacing:2px; color:#0b0b0b; background:#fff; border:2.5px solid #0b0b0b; border-radius:8px; overflow:hidden; line-height:1; margin-top:1rem; box-shadow:0 6px 16px -8px rgba(0,0,0,.5); }
  .plate .eu { background:#1B48C4; color:#fff; font-size:.6rem; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0 .5rem; }
  .plate .eu::before { content:"★★★"; font-size:.45rem; color:#FFD24D; letter-spacing:-1px; }
  .plate .num { padding:.5rem .8rem; font-size:1.4rem; white-space:nowrap; }
  .body { padding:1.4rem; }
  .kback { display:inline-flex; align-items:center; gap:.35rem; background:none; border:none; color:var(--muted); font-weight:700; font-size:.86rem; cursor:pointer; padding:0 0 .7rem; }
  label.f { display:block; font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:.4rem; }
  .kmknown { font-size:.86rem; color:var(--muted); margin:.2rem 0 1rem; }
  .kmknown b { color:var(--ink); }
  input#km {
    width:100%; font-size:1.9rem; font-weight:800; text-align:center; letter-spacing:1px;
    padding:.85rem .6rem; border:2px solid var(--line); border-radius:.9rem; color:var(--ink);
    outline:none; transition:border-color .15s, box-shadow .15s; -moz-appearance:textfield;
  }
  input#km::-webkit-outer-spin-button, input#km::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  input#km:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(249,115,22,.14); }
  .unit { text-align:center; font-size:.78rem; color:var(--muted); margin-top:.4rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  button.go {
    width:100%; margin-top:1.3rem; padding:1rem; border:none; border-radius:.9rem; cursor:pointer;
    background:linear-gradient(135deg,#0B1220,#1E293B); color:#fff; font-size:1.02rem; font-weight:800;
    letter-spacing:.01em; transition:transform .12s, box-shadow .12s, opacity .12s; box-shadow:0 14px 30px -14px rgba(11,18,32,.8);
  }
  button.go:hover { transform:translateY(-1px); }
  button.go:active { transform:translateY(0); }
  button.go:disabled { opacity:.55; cursor:default; transform:none; }
  .msg { margin-top:1rem; font-size:.9rem; border-radius:.7rem; padding:.8rem 1rem; display:none; }
  .msg.err { display:block; background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; }
  .foot { text-align:center; font-size:.74rem; color:#94A3B8; padding:1rem; }
  .center { text-align:center; }
  .big-emoji { font-size:3rem; line-height:1; }
  .ok-title { font-size:1.35rem; font-weight:900; font-style:italic; margin:.7rem 0 .3rem; }
  .spin { display:inline-block; width:22px; height:22px; border:3px solid #CBD5E1; border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hide { display:none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="lang" id="lang-switch">
          <button type="button" data-lang="fr">FR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div class="logo"><svg width="118" height="27" viewBox="0 0 154 36" xmlns="http://www.w3.org/2000/svg" aria-label="Parc Pilot"><line x1="2" y1="10" x2="24" y2="10" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="18" x2="28" y2="18" stroke="#F97316" stroke-width="3" stroke-linecap="round"/><line x1="6" y1="26" x2="22" y2="26" stroke="#FB923C" stroke-width="3" stroke-linecap="round"/><text x="34" y="26" font-size="20" font-weight="900" font-style="italic" fill="#fff">Parc</text><text x="86" y="26" font-size="20" font-weight="900" font-style="italic" fill="#F97316">Pilot</text></svg></div>
        <div class="title" id="title">Relevé kilométrique</div>
        <div class="sub" id="sub">Merci de communiquer le kilométrage de votre véhicule.</div>
        <div id="plate-wrap"></div>
      </div>
      <div class="body">
        <button id="km-back" class="kback" style="display:none" onclick="(function(){var p=new URLSearchParams(location.search);var q=p.get('q');if(q)location.href='v.html?h='+encodeURIComponent(q);else history.back();})()">‹ <span id="back-lbl">Retour</span></button>
        <!-- État : chargement -->
        <div id="loading" class="center" style="padding:1.5rem 0"><span class="spin"></span></div>

        <!-- État : formulaire -->
        <div id="form" class="hide">
          <label class="f" for="km" id="km-label">Kilométrage actuel au compteur</label>
          <div class="kmknown" id="kmknown"></div>
          <input id="km" type="number" inputmode="numeric" min="1" step="1" placeholder="ex. 45000" autocomplete="off">
          <div class="unit" id="unit">kilomètres</div>
          <div class="msg err" id="err"></div>
          <button class="go" id="send">Envoyer mon kilométrage</button>
        </div>

        <!-- État : merci -->
        <div id="done" class="center hide">
          <div class="big-emoji">✅</div>
          <div class="ok-title" id="done-title">Merci !</div>
          <div class="sub" style="color:var(--muted)" id="done-sub">Votre kilométrage a bien été enregistré.</div>
        </div>

        <!-- État : lien invalide -->
        <div id="bad" class="center hide">
          <div class="big-emoji">⛓️‍💥</div>
          <div class="ok-title" id="bad-title">Lien indisponible</div>
          <div class="sub" style="color:var(--muted)" id="bad-sub">Ce lien n'est plus valide.</div>
        </div>
      </div>
    </div>
    <div class="foot"><span id="foot-lbl">Parc Pilot — gestion de flotte · </span><span id="soc-foot"></span></div>
  </div>

<script>
(function () {
  var FN = 'https://tzjuptlzoywjeigmyfuj.supabase.co/functions/v1/km-collect';
  var APIKEY = 'sb_publishable_KC3TZ1zda-ja-0wkyjHUlg_aKohD6tq';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var token = params.get('t') || '';          // lien e-mail à usage unique
  var qr = params.get('q') || '';              // QR permanent collé dans le véhicule
  var isQr = !!qr && !token;

  // ============ Traductions FR / EN ============
  var STR = {
    fr: {
      title: 'Relevé kilométrique', sub: 'Merci de communiquer le kilométrage de votre véhicule.',
      back: 'Retour', label: 'Kilométrage actuel au compteur', unit: 'kilomètres', km_ph: 'ex. 45000',
      send: 'Envoyer mon kilométrage', sending: 'Envoi…',
      done_title: 'Merci !', done_sub: 'Votre kilométrage a bien été enregistré.',
      bad_title: 'Lien indisponible', bad_sub: 'Ce lien n\'est plus valide.',
      foot: 'Parc Pilot — gestion de flotte · ',
      hello: function (n) { return 'Bonjour ' + n + ', merci d\'indiquer le kilométrage de votre véhicule.'; },
      already: function (v) { return 'Vous avez déjà répondu (<b>' + v + ' km</b>). Vous pouvez corriger si besoin.'; },
      lastknown: function (v) { return 'Dernier kilométrage connu : <b>' + v + ' km</b>'; },
      saved: function (v) { return 'Kilométrage enregistré : <b>' + v + ' km</b>. Vous pouvez fermer cette page.'; },
      incomplete: 'Lien incomplet. Scanne le QR de ton véhicule ou ouvre le lien reçu par e-mail.',
      invalid: 'Ce lien n\'est plus valide.', conn: 'Connexion impossible. Réessaie dans un instant.',
      needkm: 'Saisis ton kilométrage (un nombre).', sendfail: 'Échec de l\'envoi. Réessaie.', conn2: 'Connexion impossible. Réessaie.'
    },
    en: {
      title: 'Mileage reading', sub: 'Please provide your vehicle\'s mileage.',
      back: 'Back', label: 'Current odometer reading', unit: 'kilometres', km_ph: 'e.g. 45000',
      send: 'Submit my mileage', sending: 'Sending…',
      done_title: 'Thank you!', done_sub: 'Your mileage has been recorded.',
      bad_title: 'Link unavailable', bad_sub: 'This link is no longer valid.',
      foot: 'Parc Pilot — fleet management · ',
      hello: function (n) { return 'Hello ' + n + ', please enter your vehicle\'s mileage.'; },
      already: function (v) { return 'You have already replied (<b>' + v + ' km</b>). You can correct it if needed.'; },
      lastknown: function (v) { return 'Last known mileage: <b>' + v + ' km</b>'; },
      saved: function (v) { return 'Mileage recorded: <b>' + v + ' km</b>. You can close this page.'; },
      incomplete: 'Incomplete link. Scan your vehicle\'s QR code or open the link you received by email.',
      invalid: 'This link is no longer valid.', conn: 'Connection failed. Please try again shortly.',
      needkm: 'Enter your mileage (a number).', sendfail: 'Sending failed. Please try again.', conn2: 'Connection failed. Please try again.'
    }
  };
  // Langue : ?lang= (depuis le portail) → préférence enregistrée → serveur (plus bas) → FR.
  var LANG = 'fr';
  var urlLang = (params.get('lang') || '').toLowerCase();
  var savedLang = null; try { savedLang = localStorage.getItem('pp_lang'); } catch (e) {}
  if (urlLang === 'en' || urlLang === 'fr') LANG = urlLang;
  else if (savedLang === 'en' || savedLang === 'fr') LANG = savedLang;
  var manual = !!(urlLang || savedLang);      // langue déjà fixée par l'utilisateur ?
  function t(k) { return STR[LANG][k]; }
  function localeNb() { return LANG === 'en' ? 'en-GB' : 'fr-FR'; }
  function applyStaticI18n() {
    document.documentElement.lang = LANG;
    $('title').textContent = t('title');
    $('km-label').textContent = t('label');
    $('unit').textContent = t('unit');
    $('back-lbl').textContent = t('back');
    $('foot-lbl').textContent = t('foot');
    $('km').setAttribute('placeholder', t('km_ph'));
    if (!$('send').disabled) $('send').textContent = t('send');
    $('done-title').textContent = t('done_title');
    $('bad-title').textContent = t('bad_title');
    document.querySelectorAll('#lang-switch button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === LANG); });
  }

  // Bouton « Retour » vers le portail conducteur quand on arrive via le QR du véhicule.
  if (isQr) { var _bk = $('km-back'); if (_bk) _bk.style.display = 'inline-flex'; }
  function keyParam() { return isQr ? ('q=' + encodeURIComponent(qr)) : ('t=' + encodeURIComponent(token)); }
  function keyBody() { return isQr ? { q: qr } : { t: token }; }

  var lastState = 'loading';   // pour re-render les sous-titres au changement de langue
  function show(id) {
    lastState = id;
    ['loading', 'form', 'done', 'bad'].forEach(function (k) { $(k).classList.toggle('hide', k !== id); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }
  function plateHTML(p) {
    if (!p) return '';
    return '<div class="plate"><div class="eu">F</div><div class="num">' + esc(p) + '</div></div>';
  }
  function headers() { return { 'Content-Type': 'application/json', 'apikey': APIKEY, 'Authorization': 'Bearer ' + APIKEY }; }

  // État courant du véhicule (pour re-afficher les sous-titres à la bascule de langue)
  var CUR = { chauffeur: '', kmConnu: null, deja: false, kmRecu: null };
  function paintForm() {
    if (CUR.chauffeur) $('sub').textContent = t('hello')(String(CUR.chauffeur).split(' ')[0]);
    else $('sub').textContent = t('sub');
    if (CUR.deja && CUR.kmRecu != null) { $('kmknown').innerHTML = t('already')(Number(CUR.kmRecu).toLocaleString(localeNb())); }
    else if (CUR.kmConnu != null) { $('kmknown').innerHTML = t('lastknown')(Number(CUR.kmConnu).toLocaleString(localeNb())); }
    else { $('kmknown').innerHTML = ''; }
  }

  // Sélecteur de langue
  $('lang-switch').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lang]'); if (!b) return;
    LANG = b.getAttribute('data-lang') === 'en' ? 'en' : 'fr'; manual = true;
    try { localStorage.setItem('pp_lang', LANG); } catch (err) {}
    applyStaticI18n();
    if (lastState === 'form') paintForm();
  });

  applyStaticI18n();

  if (!token && !qr) { show('bad'); applyStaticI18n(); $('bad-sub').textContent = t('incomplete'); return; }

  // 1) Charger les infos du véhicule
  fetch(FN + '?' + keyParam(), { headers: headers() })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      var d = res.d || {};
      if (!res.ok || !d.ok) { show('bad'); $('bad-sub').textContent = d.error || t('invalid'); return; }
      // Langue du conducteur (serveur) si l'utilisateur n'a rien choisi manuellement.
      if (!manual && d.langue === 'en') { LANG = 'en'; applyStaticI18n(); }
      if (d.plaque) $('plate-wrap').innerHTML = plateHTML(d.plaque);
      if (d.societe) { $('soc-foot').textContent = d.societe; }
      CUR.chauffeur = d.chauffeur || ''; CUR.kmConnu = d.kmConnu; CUR.deja = !!d.deja; CUR.kmRecu = d.kmRecu;
      if (d.deja && d.kmRecu != null) $('km').value = d.kmRecu;
      show('form'); paintForm();
      setTimeout(function () { $('km').focus(); }, 150);
    })
    .catch(function () { show('bad'); $('bad-sub').textContent = t('conn'); });

  // 2) Envoyer le km
  function submit() {
    var km = parseInt(($('km').value || '').replace(/[^0-9]/g, ''), 10);
    $('err').style.display = 'none';
    if (!km || km <= 0) { $('err').textContent = t('needkm'); $('err').style.display = 'block'; return; }
    $('send').disabled = true; $('send').innerHTML = '<span class="spin" style="width:18px;height:18px;border-width:2px;vertical-align:-3px"></span> ' + esc(t('sending'));
    var _body = keyBody(); _body.km = km;
    fetch(FN, { method: 'POST', headers: headers(), body: JSON.stringify(_body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        var d = res.d || {};
        if (!res.ok || !d.ok) {
          $('send').disabled = false; $('send').textContent = t('send');
          $('err').textContent = d.error || t('sendfail'); $('err').style.display = 'block'; return;
        }
        $('done-sub').innerHTML = t('saved')(Number(d.km).toLocaleString(localeNb()));
        show('done');
      })
      .catch(function () {
        $('send').disabled = false; $('send').textContent = t('send');
        $('err').textContent = t('conn2'); $('err').style.display = 'block';
      });
  }
  $('send').addEventListener('click', submit);
  $('km').addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
})();
</script>
</body>
</html>
