# Parc Pilot — configuration des Edge Functions (lue par le CLI Supabase au déploiement).
#
# km-collect est une fonction PUBLIQUE (le chauffeur n'a pas de compte Parc Pilot) : elle
# est protégée par un TOKEN secret dans le lien, pas par un JWT. On désactive donc la
# vérification du JWT pour cette fonction UNIQUEMENT. Les autres fonctions (send-email,
# manage-users, scan-doc) gardent le comportement par défaut (JWT requis + contrôle interne).
project_id = "tzjuptlzoywjeigmyfuj"

[functions.km-collect]
verify_jwt = false

# edl-sign : page de signature d'état des lieux PUBLIQUE (l'employé n'a pas de compte).
# Protégée par un TOKEN secret dans le lien (comme km-collect). JWT désactivé.
[functions.edl-sign]
verify_jwt = false

# km-relance : relance AUTOMATIQUE des relevés km, appelée par une tâche planifiée
# (pg_cron) qui n'a pas de JWT utilisateur. Protégée par l'en-tête x-cron-secret
# (== KM_RELANCE_SECRET) OU un JWT de CEO pour un test manuel — contrôle fait DANS la
# fonction. On désactive donc la vérification du JWT par la plateforme.
[functions.km-relance]
verify_jwt = false
