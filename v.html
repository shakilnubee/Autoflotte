<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>Mon véhicule — Parc Pilot</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1E3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0F1E3D; --muted:#64748B; --accent:#F97316; --line:#E7EBF0; }
  * { box-sizing:border-box; font-family:'Inter',system-ui,sans-serif; }
  body { margin:0; background:#F1F5F9; color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; align-items:flex-start; }
  .wrap { max-width:480px; margin:0 auto; padding:1.1rem; width:100%; }
  .card { background:#fff; border:1px solid var(--line); border-radius:1.1rem; box-shadow:0 20px 50px -30px rgba(15,30,61,.4); overflow:hidden; margin-top:2.2rem; }
  .head { background:linear-gradient(135deg,#0B1220,#1E293B); color:#fff; padding:1.4rem 1.4rem 1.6rem; position:relative; }
  .head::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,var(--accent),#FB923C 45%,transparent); }
  .logo { font-weight:900; font-style:italic; font-size:1.05rem; letter-spacing:-.02em; }
  .logo .o { color:var(--accent); }
  .title { font-size:1.4rem; font-weight:900; font-style:italic; letter-spacing:-.02em; margin:.7rem 0 .1rem; color:#fff; }
  .sub { color:#8598B4; font-size:.92rem; }
  .plate { display:inline-flex; align-items:stretch; font-weight:800; letter-spacing:2px; color:#0b0b0b; background:#fff; border:2.5px solid #0b0b0b; border-radius:8px; overflow:hidden; line-height:1; margin-top:1rem; box-shadow:0 6px 16px -8px rgba(0,0,0,.5); }
  .plate .eu { background:#1B48C4; color:#fff; font-size:.6rem; font-weight:800; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:0 .5rem; }
  .plate .eu::before { content:"★★★"; font-size:.45rem; color:#FFD24D; letter-spacing:-1px; }
  .plate .num { padding:.5rem .8rem; font-size:1.4rem; white-space:nowrap; }
  .body { padding:1.2rem 1.2rem 1.4rem; }
  /* Boutons du menu (les 3 parties) */
  .menu { display:flex; flex-direction:column; gap:.8rem; }
  a.tap {
    display:flex; align-items:center; gap:1rem; text-decoration:none; color:var(--ink);
    border:1.5px solid var(--line); border-radius:1rem; padding:1rem 1.1rem; background:#fff;
    box-shadow:0 10px 26px -22px rgba(15,30,61,.55); transition:transform .12s, box-shadow .12s, border-color .12s;
    position:relative; overflow:hidden;
  }
  a.tap::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--bar,#CBD5E1); }
  a.tap:hover { transform:translateY(-2px); box-shadow:0 18px 34px -22px rgba(15,30,61,.6); border-color:#CBD5E1; }
  a.tap:active { transform:translateY(0); }
  .ic {
    flex:0 0 46px; width:46px; height:46px; border-radius:.85rem; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; background:var(--tint,#F1F5F9);
  }
  .tx { flex:1; min-width:0; }
  .tx .t { font-weight:800; font-size:1.02rem; letter-spacing:-.01em; }
  .tx .d { color:var(--muted); font-size:.82rem; margin-top:.1rem; }
  .chev { color:#CBD5E1; font-size:1.3rem; font-weight:700; }
  .km { --bar:#F97316; }  .km .ic  { --tint:#FFF1E6; }
  .sin { --bar:#EF4444; } .sin .ic { --tint:#FEECEC; }
  .inf { --bar:#3B82F6; } .inf .ic { --tint:#E9F1FE; }
  .foot { text-align:center; font-size:.74rem; color:#94A3B8; padding:1rem; }
  .center { text-align:center; }
  .big-emoji { font-size:3rem; line-height:1; }
  .ok-title { font-size:1.35rem; font-weight:900; font-style:italic; margin:.7rem 0 .3rem; }
  .spin { display:inline-block; width:22px; height:22px; border:3px solid #CBD5E1; border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hide { display:none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="logo">Parc P<span class="o">i</span>lot</div>
        <div class="title">Mon véhicule</div>
        <div class="sub" id="sub">Que souhaitez-vous faire ?</div>
        <div id="plate-wrap"></div>
      </div>
      <div class="body">
        <!-- État : chargement -->
        <div id="loading" class="center" style="padding:1.5rem 0"><span class="spin"></span></div>

        <!-- État : menu (les 3 parties) -->
        <div id="menu" class="menu hide">
          <a class="tap km" id="a-km" href="#">
            <div class="ic">📏</div>
            <div class="tx"><div class="t">Relever le kilométrage</div><div class="d">Saisir le km au compteur</div></div>
            <div class="chev">›</div>
          </a>
          <a class="tap sin" id="a-sin" href="#">
            <div class="ic">🚨</div>
            <div class="tx"><div class="t">Déclarer un sinistre</div><div class="d">Accident, choc, bris de glace…</div></div>
            <div class="chev">›</div>
          </a>
          <a class="tap inf" id="a-inf" href="#">
            <div class="ic">ℹ️</div>
            <div class="tx"><div class="t">Infos du véhicule</div><div class="d">Fiche : modèle, contrôles, échéances</div></div>
            <div class="chev">›</div>
          </a>
        </div>

        <!-- État : lien invalide -->
        <div id="bad" class="center hide">
          <div class="big-emoji">⛓️‍💥</div>
          <div class="ok-title">Lien indisponible</div>
          <div class="sub" style="color:var(--muted)" id="bad-sub">Ce QR n'est plus valide.</div>
        </div>
      </div>
    </div>
    <div class="foot">Parc Pilot — gestion de flotte · <span id="soc-foot"></span></div>
  </div>

<script>
(function () {
  var FN = 'https://tzjuptlzoywjeigmyfuj.supabase.co/functions/v1/km-collect';
  var APIKEY = 'sb_publishable_KC3TZ1zda-ja-0wkyjHUlg_aKohD6tq';
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var token = params.get('h') || '';                 // jeton PERMANENT du véhicule (= jeton km_qr)
  var mailTo = params.get('m') || '';                 // destinataire e-mail « sinistre » (optionnel)

  function show(id) {
    ['loading', 'menu', 'bad'].forEach(function (k) { $(k).classList.toggle('hide', k !== id); });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); }
  function plateHTML(p) {
    if (!p) return '';
    return '<div class="plate"><div class="eu">F</div><div class="num">' + esc(p) + '</div></div>';
  }
  function headers() { return { 'Content-Type': 'application/json', 'apikey': APIKEY, 'Authorization': 'Bearer ' + APIKEY }; }

  if (!token) { show('bad'); $('bad-sub').textContent = 'QR incomplet. Scanne le QR collé dans ton véhicule.'; return; }

  // Résout le véhicule (plaque + société) depuis le jeton permanent, via l'Edge Function km-collect.
  fetch(FN + '?q=' + encodeURIComponent(token), { headers: headers() })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      var d = res.d || {};
      if (!res.ok || !d.ok) { show('bad'); $('bad-sub').textContent = d.error || 'Ce QR n\'est plus valide.'; return; }
      var plaque = d.plaque || '';
      if (plaque) $('plate-wrap').innerHTML = plateHTML(plaque);
      if (d.societe) $('soc-foot').textContent = d.societe;

      // 1) Relevé km → page publique existante, verrouillée sur le véhicule (même jeton).
      $('a-km').setAttribute('href', 'km.html?q=' + encodeURIComponent(token));

      // 2) Déclarer un sinistre → e-mail pré-rempli (destinataire transmis dans le QR, plaque connue).
      var subject = 'Déclaration de sinistre — ' + plaque;
      var lignes = [
        'Véhicule : ' + plaque,
        '',
        'Date et heure du sinistre : ',
        'Lieu : ',
        "Circonstances (que s'est-il passé ?) : ",
        'Tiers impliqué ? (plaque, assureur, nom) : ',
        'Blessés ? : ',
        '',
        'Merci de joindre le constat amiable et des photos des dommages.'
      ].join('\n');
      $('a-sin').setAttribute('href', 'mailto:' + encodeURIComponent(mailTo) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(lignes));

      // 3) Infos du véhicule → fiche publique (aucune donnée personnelle).
      $('a-inf').setAttribute('href', 'carte.html?v=' + encodeURIComponent(plaque));

      show('menu');
    })
    .catch(function () { show('bad'); $('bad-sub').textContent = 'Connexion impossible. Réessaie dans un instant.'; });
})();
</script>
</body>
</html>
